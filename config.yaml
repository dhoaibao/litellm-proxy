model_list:
  # Per-deployment rpm/tpm values are intentionally omitted until provider quotas are known.
  # LiteLLM can use those values for routing capacity, but hard enforcement should not be
  # enabled without confirmed limits for each upstream account.

  # --- Kimi Code ---
  - model_name: kimi-for-coding
    litellm_params:
      model: anthropic/kimi-for-coding
      api_base: https://api.kimi.com/coding/
      api_key: os.environ/KIMI_CODE_API_KEY

  # --- Google AI Studio ---
  - model_name: gemini/gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY
      cache_control_injection_points:
        - location: message
          role: system

  - model_name: gemini/gemma-4-26b-a4b-it
    litellm_params:
      model: gemini/gemma-4-26b-a4b-it
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini/gemma-4-31b-it
    litellm_params:
      model: gemini/gemma-4-31b-it
      api_key: os.environ/GEMINI_API_KEY

  # --- GitHub Copilot ---
  - model_name: github_copilot/gemini-3.1-pro-preview
    litellm_params:
      model: github_copilot/gemini-3.1-pro-preview

  - model_name: github_copilot/gemini-3-flash-preview
    litellm_params:
      model: github_copilot/gemini-3-flash-preview

  - model_name: github_copilot/gpt-5.4-mini
    litellm_params:
      model: github_copilot/gpt-5.4-mini

  - model_name: github_copilot/claude-haiku-4.5
    litellm_params:
      model: github_copilot/claude-haiku-4.5

  - model_name: github_copilot/gpt-5-mini
    litellm_params:
      model: github_copilot/gpt-5-mini

  - model_name: github_copilot/gpt-4.1
    litellm_params:
      model: github_copilot/gpt-4.1

  - model_name: github_copilot/gpt-4o
    litellm_params:
      model: github_copilot/gpt-4o

  # --- Private Proxy ---
  - model_name: private/gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_base: os.environ/PRIVATE_API_PROXY_URL
      api_key: os.environ/PRIVATE_API_KEY

  - model_name: private/gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_base: os.environ/PRIVATE_API_PROXY_URL
      api_key: os.environ/PRIVATE_API_KEY

  - model_name: private/claude-opus-4-7
    litellm_params:
      model: openai/claude-opus-4-7
      api_base: os.environ/PRIVATE_API_PROXY_URL
      api_key: os.environ/PRIVATE_API_KEY

  - model_name: private/claude-opus-4-6
    litellm_params:
      model: openai/claude-opus-4-6
      api_base: os.environ/PRIVATE_API_PROXY_URL
      api_key: os.environ/PRIVATE_API_KEY

  - model_name: private/claude-sonnet-4-6
    litellm_params:
      model: openai/claude-sonnet-4-6
      api_base: os.environ/PRIVATE_API_PROXY_URL
      api_key: os.environ/PRIVATE_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 3
  request_timeout: 120
  allowed_fails: 3
  set_verbose: false
  json_logs: true
  cache: true
  enable_redis_auth_cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    namespace: litellm:proxy:cache
    ttl: 3600
    max_connections: 100
  enable_caching_on_provider_specific_optional_params: true
  callbacks: ["compression_interception"]
  compression_interception_params:
    enabled: true
    compression_trigger: 30000
    compression_target: 20000
  stream: true

router_settings:
  routing_strategy: simple-shuffle
  optional_pre_call_checks: ["PromptCachingDeploymentCheck"]
  cooldown_time: 60
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  cache_params:
    type: redis
    max_connections: 100

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  proxy_batch_write_at: 60
  database_connection_pool_limit: 10
  user_api_key_cache_ttl: 300
  disable_error_logs: true
  allow_requests_on_db_unavailable: true

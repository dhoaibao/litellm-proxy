services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - github_copilot_auth:/root/.config/litellm/github_copilot
      - chatgpt_auth:/root/.config/litellm/chatgpt
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --num_workers
      - ${LITELLM_NUM_WORKERS:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - KIMI_CODE_API_KEY=${KIMI_CODE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - PRIVATE_API_KEY=${PRIVATE_API_KEY}
      - PRIVATE_API_PROXY_URL=${PRIVATE_API_PROXY_URL}
      - UI_USERNAME=${UI_USERNAME}
      - UI_PASSWORD=${UI_PASSWORD}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - LITELLM_NUM_WORKERS=${LITELLM_NUM_WORKERS:-4}
      - CHATGPT_TOKEN_DIR=/root/.config/litellm/chatgpt
      - STORE_MODEL_IN_DB=true
      - LITELLM_MODE=PRODUCTION
      - LITELLM_LOG=ERROR
      - USE_PRISMA_MIGRATE=True

volumes:
  postgres_data:
  redis_data:
  github_copilot_auth:
  chatgpt_auth:
